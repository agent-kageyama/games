<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エージェント影山の任務ファイル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #1c1c1f; color: #eee;
    min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 440px; padding: 32px 20px 48px; }
  .stamp {
    display: inline-block; border: 2px solid #d64545; color: #d64545;
    font-size: 12px; font-weight: 700; letter-spacing: .15em;
    padding: 2px 8px; transform: rotate(-4deg); margin-bottom: 12px;
  }
  h1 { font-size: 24px; line-height: 1.4; }
  .lead { color: #aaa; font-size: 14px; margin: 8px 0 28px; }
  ul { list-style: none; display: grid; gap: 12px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #c9b48a; color: #2a2418;
    border-radius: 4px; padding: 16px 18px; position: relative;
    box-shadow: 0 3px 0 #8d7a55;
  }
  a.card:active { transform: translateY(2px); box-shadow: 0 1px 0 #8d7a55; }
  .no { font-size: 11px; font-weight: 700; opacity: .7; letter-spacing: .1em; }
  .name { font-size: 18px; font-weight: 700; margin: 2px 0 4px; }
  .desc { font-size: 13px; }
  footer { margin-top: 36px; color: #777; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="stamp">極秘</div>
  <h1>エージェント影山の<br>任務ファイル</h1>
  <p class="lead">冴えない男は、今日もどこかに潜入している。</p>
  <ul>
    <li>
      <a class="card" href="https://agent-kageyama.github.io/Jack-o-Punch/Jack-o-Punch.html">
        <div class="no">MISSION</div>
        <div class="name">Jack-o-Punch</div>
        <div class="desc">カボチャを殴ってジャック・オ・ランタンにせよ。</div>
      </a>
    </li>
  </ul>
  <footer>© エージェント影山</footer>
</main>
</body>
</html>
